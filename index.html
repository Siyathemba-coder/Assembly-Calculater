<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assembly Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="wrap">
    <div id="screen">
      <div id="expr"></div>
      <div id="result">0</div>
      <div id="err"></div>
    </div>
    <div class="grid">
      <button class="clr span2" onclick="ac()">AC</button>
      <button class="clr" onclick="del()">&#9003;</button>
      <button class="op" onclick="op('%')">%</button>

      <button onclick="num('7')">7</button>
      <button onclick="num('8')">8</button>
      <button onclick="num('9')">9</button>
      <button class="op" onclick="op('/')">&#247;</button>

      <button onclick="num('4')">4</button>
      <button onclick="num('5')">5</button>
      <button onclick="num('6')">6</button>
      <button class="op" onclick="op('*')">&#215;</button>

      <button onclick="num('1')">1</button>
      <button onclick="num('2')">2</button>
      <button onclick="num('3')">3</button>
      <button class="op" onclick="op('-')">&#8722;</button>

      <button class="span2" onclick="num('0')">0</button>
      <button onclick="dot()">.</button>
      <button class="op" onclick="op('+')">+</button>

      <button class="eq span4" onclick="eq()">=</button>
    </div>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
